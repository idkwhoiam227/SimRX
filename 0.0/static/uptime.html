<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uptime — SimRX Callsign DB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <div class="logo"><a href="/" style="color:inherit; text-decoration:none;">SimRX</a></div>
  <a href="/" style="font-size:0.85rem; color:var(--text-dim);">← Dashboard</a>
</header>
<main>
  <h1>Uptime</h1>

  <div class="records-grid" id="uptime-grid"></div>

  <h1 style="margin-top:36px">Restart history</h1>
  <div class="card"><table id="restarts-table"><thead>
    <tr><th>Started</th></tr>
  </thead><tbody></tbody></table></div>

  <h1 style="margin-top:36px">Collector gaps</h1>
  <div class="card"><canvas id="outages-chart" height="100"></canvas></div>
  <div class="card" style="margin-top:14px"><table id="outages-table"><thead>
    <tr><th>Started</th><th>Ended</th><th>Duration</th></tr>
  </thead><tbody></tbody></table></div>
</main>
<script>
function esc(s) {
  return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtTime(unixSec) {
  if (!unixSec) return "—";
  return new Date(unixSec * 1000).toLocaleString("en-US");
}
function fmtDuration(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

let serverStartedAt = null;

function tickUptime() {
  const el = document.getElementById("uptime-live");
  if (!el || serverStartedAt === null) return;
  el.textContent = fmtDuration(Math.floor(Date.now() / 1000) - serverStartedAt);
}
setInterval(tickUptime, 1000);

async function loadUptime() {
  const res = await fetch("/api/server-uptime");
  const data = await res.json();
  serverStartedAt = data.started_at;

  document.getElementById("uptime-grid").innerHTML = `
    <div class="card record-card">
      <div class="period-label">Current uptime</div>
      <div class="duration" id="uptime-live">${data.uptime_seconds !== null ? fmtDuration(data.uptime_seconds) : "—"}</div>
      <div class="small-note">since ${fmtTime(data.started_at)}</div>
    </div>
    <div class="card record-card">
      <div class="period-label">Total restarts recorded</div>
      <div class="duration">${data.restart_count}</div>
    </div>
  `;

  const tbody = document.querySelector("#restarts-table tbody");
  tbody.innerHTML = data.recent_starts.length
    ? data.recent_starts.map(t => `<tr><td>${fmtTime(t)}</td></tr>`).join("")
    : '<tr><td class="empty-state">No data</td></tr>';
}

let outagesChart = null;

async function loadOutages() {
  const res = await fetch("/api/collector-outages");
  const data = await res.json();

  const tbody = document.querySelector("#outages-table tbody");
  tbody.innerHTML = data.outages.length
    ? data.outages.map(o => `<tr><td data-label="Started">${fmtTime(o.started_at)}</td><td data-label="Ended">${fmtTime(o.ended_at)}</td><td data-label="Duration">${fmtDuration(o.duration_seconds)}</td></tr>`).join("")
    : '<tr><td colspan="3" class="empty-state">No gaps recorded</td></tr>';

  const chronological = [...data.outages].reverse(); // oldest first, so the chart reads left-to-right in time
  if (outagesChart) outagesChart.destroy();
  const ctx = document.getElementById("outages-chart");
  if (!chronological.length) {
    ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
    return;
  }
  outagesChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: chronological.map(o => fmtTime(o.started_at)),
      datasets: [{ label: "Gap duration (min)", data: chronological.map(o => Math.round(o.duration_seconds / 60)), backgroundColor: "#e0604a" }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#7f9189", maxRotation: 60, minRotation: 45 }, grid: { color: "#23302a" } },
        y: { ticks: { color: "#7f9189" }, grid: { color: "#23302a" }, beginAtZero: true },
      },
    },
  });
}

loadUptime();
loadOutages();
</script>
</body>
</html>
